name: Build Publications and CV

on:
  push:
    branches:
      - main
    paths:
      - 'publications.bib'
      - 'generate_publications.py'
      - 'cv_academic/nikolaos_korfiatis_academic_cv.tex'
      - 'cv_academic/photo.jpg'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate publications (MD and LaTeX)
        run: |
          python generate_publications.py

      - name: Setup TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages
        run: |
          tlmgr update --self
          tlmgr install \
            babel-english babel-greek greek-fontenc cbfonts cbfonts-fd cm-super \
            fontawesome5 enumitem fancyhdr lastpage wrapfig titlesec tools graphics \
            xcolor hyperref geometry etoolbox epstopdf-pkg refcount rerunfilecheck \
            uniquecounter amsfonts url

      - name: Build Academic CV
        working-directory: cv_academic
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error nikolaos_korfiatis_academic_cv.tex
          pdflatex -interaction=nonstopmode -halt-on-error nikolaos_korfiatis_academic_cv.tex

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add generated files
          git add publications.md by_year.md ref.md clinical_trials.md policy_citations.md
          git add cv_academic/publications_generated.tex
          git add cv_academic/nikolaos_korfiatis_academic_cv.pdf

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate publications and CV from BibTeX"
            git push
          fi

      # nkorf.github.io builds its publication pages from this repository.
      # SITE_DISPATCH_TOKEN: fine-grained token on nkorf/nkorf.github.io
      # with Contents read and write (needed for repository_dispatch).
      - name: Trigger nkorf.github.io rebuild
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set; nkorf.github.io picks this up at its daily 05:30 UTC build"
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SITE_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nkorf/nkorf.github.io/dispatches \
            -d '{"event_type":"profile-updated"}'
          echo "Requested a rebuild of nkorf.github.io"
